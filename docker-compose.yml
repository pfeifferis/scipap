services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scipap_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./papers:/app/papers
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PAPERS_DIR=/app/papers
      - DATA_DIR=/app/data
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scipap_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  data:
